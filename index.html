<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small portfolio site for the person behind the character Mordraga, a liminal witch VTuber archetype.">
    <title>Liminal Witch Portfolio</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preload" as="font" type="font/ttf" crossorigin
      href="https://raw.githubusercontent.com/Mordraga/BarazhadHost/main/Terminal/Modeseven-L3n5.ttf">

</head>
<body>
    <main class="screen">
        <section id="terminalLog" class="terminalPage terminalLog" aria-live="polite">
            <h1>Welcome to LiminalWitch.CV</h1>
            <p>
                If you prefer a standard UI experience, all folders are
                clickable so you don't need to type <codeblock>cd &lt;argument&gt;</codeblock>
                to navigate. But where's the fun in that. &lt;3
            </p>
                
            <p>Type <codeblock data-command="enter">enter</codeblock>. or 
               <codeblock data-command="begin">begin</codeblock> to begin.
            </p>

            <p>Type <codeblock data-command="help">help</codeblock> for a list of commands.</p>
        </section>

        <div id="terminalPrompt" class="input-button-wrapper">
            <span class="sr-only">Input command</span>
            <span class="prompt">&gt;</span>
            <div id="inputShell" class="inputShell" role="textbox" aria-label="Input command" tabindex="0">
                <span id="promptText" class="promptText promptText--placeholder">Input Command</span>
                <span class="cursor" aria-hidden="true"></span>
            </div>
        </div>
    </main>

    <script type="module" src="scripts/app.js"></script>
</body>
</html>
